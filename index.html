<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <form id="registrationForm">

            <h1>Create Account</h1>
            <p class="subtitle">Fill in your details to register</p>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your name">
                <small class="error" id="nameError"></small>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="text" id="email" placeholder="Enter your email">
                <small class="error" id="emailError"></small>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="At least 6 characters">
                <small class="error" id="passwordError"></small>
            </div>

            <div class="form-group">
                <label>Bio</label>
                <textarea id="bio" maxlength="200" placeholder="Tell us about yourself"></textarea>

                <div class="counter" id="bioCounter">
                    0 / 200 characters
                </div>

                <small class="error" id="bioError"></small>
            </div>

            <button type="submit" id="submitBtn" disabled>
                Register
            </button>

            <p id="successMessage" class="success"></p>

        </form>
    </div>

    <script src="javaScript.js"></script>
</body>
</html>
